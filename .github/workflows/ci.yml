name: CI

# ER-02 acceptance (ACCEPTANCE_CONTRACT §3.1): runs on PR + main, credential-free, under 15
# minutes, and gates every change on the same command a human runs locally (`npm run verify`).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
